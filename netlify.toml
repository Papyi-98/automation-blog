[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.155.1"
  HUGO_ENV = "production"

# Enable Netlify Forms
[forms]
  [forms.honeypot]
    enable = true

# Enable Netlify Functions
[functions]
  directory = "netlify/functions"

# For larger sites, you might need this
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Form submission redirects
[[redirects]]
  from = "/"
  to = "/form-success/"
  status = 200
  conditions = {Form = "add-project"}

# Redirect form submissions to success page
[[redirects]]
  from = "/*"
  to = "/form-success/"
  status = 200
  conditions = {Form = "add-project"}
