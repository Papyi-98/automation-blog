<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="/css/output.css">
    <!-- Pagefind Search CSS -->
    <style>
        .search-container {
            position: relative;
            max-width: 400px;
            margin-left: auto;
        }
        .search-input {
  color-scheme: light dark;
            width: 100%;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: 2px solid transparent;
            background-color: rgba(255, 255, 255, 0.1); @apply dark:bg-gray-800/50;
            color: white;
            transition: all 0.2s;
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background-color: rgba(255, 255, 255, 0.15); @apply dark:bg-gray-800/70;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white; @apply dark:bg-gray-800;
            border-radius: 0.375rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 50;
        }
        .search-result-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
            color: #1f2937; @apply dark:text-gray-200;
            text-decoration: none;
            display: block;
            transition: background-color 0.2s;
        }
        .search-result-item:hover {
            background-color: #f3f4f6; @apply dark:bg-gray-700;
        }
        .search-result-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .search-result-excerpt {
            font-size: 0.875rem;
            color: #6b7280; @apply dark:text-gray-400;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .no-results {
            padding: 1rem;
            color: #6b7280; @apply dark:text-gray-400;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <header class="bg-automation-blue dark:bg-blue-900 text-white p-6">
        <div class="container mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold">{{ .Site.Title }}</h1>
                <p class="mt-2 opacity-90">Automation Projects & Tutorials</p>
            </div>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input type="search" 
                       id="search-input" 
                       class="search-input" 
                       placeholder="Search posts..." 
                       aria-label="Search">
                <div id="search-results" class="search-results"></div>
            </div>
        
            <!-- Dark Mode Toggle -->
            <button id="theme-toggle" 
                    class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors flex items-center justify-center w-10 h-10 ml-2"
                    aria-label="Toggle dark mode"
                    title="Toggle dark/light mode">
              <span class="dark:hidden">🌙</span>
              <span class="hidden dark:inline">☀️</span>
            </button>
</div>
    </header>

    <main class="container mx-auto p-6" data-pagefind-body>
        {{ block "main" . }}{{ end }}
    </main>

    <footer class="bg-gray-800 dark:bg-gray-900 text-white p-6 mt-8">
        <div class="container mx-auto text-center">
            <p>© {{ now.Format "2006" }} {{ .Site.Title }}</p>
            <p class="mt-2 text-gray-400 text-sm">Built with Hugo & Tailwind CSS</p>
        </div>
    </footer>

    <!-- Pagefind Search Script -->
    <script>
        // Initialize Pagefind
        window.addEventListener('DOMContentLoaded', async () => {
            const pagefind = await import('/pagefind/pagefind.js');
            
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            
            let currentSearch = null;
            
            searchInput.addEventListener('input', async (e) => {
                const query = e.target.value.trim();
                
                // Cancel previous search
                if (currentSearch) {
                    currentSearch.cancel();
                }
                
                if (query.length < 2) {
                    searchResults.style.display = 'none';
                    return;
                }
                
                try {
                    currentSearch = pagefind.search(query);
                    const results = await currentSearch;
                    
                    searchResults.innerHTML = '';
                    
                    if (results.results.length === 0) {
                        searchResults.innerHTML = '<div class="no-results">No results found</div>';
                        searchResults.style.display = 'block';
                        return;
                    }
                    
                    // Show top 10 results
                    for (const result of results.results.slice(0, 10)) {
                        const data = await result.data();
                        
                        const resultItem = document.createElement('a');
                        resultItem.href = data.url;
                        resultItem.className = 'search-result-item';
                        
                        resultItem.innerHTML = `
                            <div class="search-result-title">${data.meta.title || 'Untitled'}</div>
                            <div class="search-result-excerpt">${data.excerpt || ''}</div>
                        `;
                        
                        searchResults.appendChild(resultItem);
                    }
                    
                    searchResults.style.display = 'block';
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Search error:', err);
                    }
                }
            });
            
            // Close search results when clicking outside
            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.style.display = 'none';
                }
            });
            
            // Handle escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchResults.style.display = 'none';
                    searchInput.blur();
                }
            });
        });
    </script>

    <!-- Dark Mode Toggle Script -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        // Check for saved theme or system preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          htmlElement.classList.add('dark');
        } else {
          htmlElement.classList.remove('dark');
        }
        
        // Toggle theme on button click
        themeToggle.addEventListener('click', () => {
          htmlElement.classList.toggle('dark');
          
          // Save preference
          if (htmlElement.classList.contains('dark')) {
            localStorage.theme = 'dark';
          } else {
            localStorage.theme = 'light';
          }
        });
        
        // Update for system preference changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!('theme' in localStorage)) {
            if (e.matches) {
              htmlElement.classList.add('dark');
            } else {
              htmlElement.classList.remove('dark');
            }
          }
        });
      });
    </script>
</script>
</body>
</html>
